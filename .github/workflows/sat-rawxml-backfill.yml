name: SAT rawXml backfill (every 6h)

# Fills in the original CFDI XML (Invoice.rawXml) for invoices imported by an
# older sync that didn't store it. Re-downloads the affected periods and repairs
# rows in place. Quota-paced and self-no-ops once every company has 0 remaining,
# so it's safe to run on a schedule until the backlog clears.
#
# Requires repo secrets CRON_SECRET and STAGING_URL (see sat-sync.yml).
# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch (main).

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  rawxml-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SAT rawXml backfill
        run: |
          set -euo pipefail
          # Strip stray whitespace from the secret (a trailing newline makes curl
          # reject the URL); fail loudly instead of masking via `| tee`.
          URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          curl -fsS -X POST "${URL}/api/cron/sat-rawxml-backfill" \
            -H "x-cron-secret: ${CRON_SECRET}" | tee response.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # As rawXml fills in, parse it locally to create the per-tax desglose
      # (InvoiceTax rows: traslados Tasa/Exento + retenciones). No SAT quota
      # involved. A stable non-zero 'remaining' (CFDIs without an Impuestos
      # node: P/T/N, no objeto) is expected — see the endpoint's note.
      - name: Trigger invoice taxes backfill (desglose de impuestos)
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          curl -fsS -X POST "${URL}/api/cron/invoice-taxes-backfill" \
            -H "x-cron-secret: ${CRON_SECRET}" | tee taxes-response.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
