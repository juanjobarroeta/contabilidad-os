name: INPC freshness (monthly)

# The INPC series lives in code (src/lib/fiscal/inpc.ts, + suplemento en
# actualizacion.ts) and is updated by PR. This monthly job runs the freshness
# check in --strict mode, so it goes RED when the series falls behind (INEGI
# publishes each month's INPC ~day 10 in the DOF) — a standing reminder to add
# the new month. It does not auto-edit values; correctness-critical numbers stay
# in code review.
#
# NOTE: GitHub only runs `schedule:` from the DEFAULT branch (main).

on:
  schedule:
    - cron: "0 16 12 * *" # day 12 monthly, ~10:00 CT, after INEGI's day-10 publish
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Check INPC series is current
        run: npm run fiscal:actualizacion-check -- --strict
      # Un rojo mensual por correo se pierde (pasó: jun, jul y ago de 2026
      # fallaron sin que nadie lo viera; el atraso lo delató la tarjeta de
      # frescura en la app). Un issue abierto no se pierde.
      - name: Abrir issue si la serie está atrasada
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "INPC atrasado in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "INPC atrasado — falta el mes publicado" \
              --body "El check mensual de frescura (--strict) falló: falta cargar el INPC del mes en src/lib/fiscal/inpc.ts. INEGI lo publica ~día 10 (DOF); Banxico SIE serie SP1 lo tiene el mismo día. Corre: npm run fiscal:actualizacion-check"
          fi
