name: Eval del copiloto (manual)

# Corre el eval del copiloto fiscal contra el despliegue (donde vive la KB) por
# páginas, agrega el resumen y guarda los resultados como artefacto. Es la
# brújula del plan «que razone como los mejores contadores»: cada fase se
# aprueba sólo si mueve estos números.
#
# Cuesta tokens (agente + juez, subtipo ai.eval en CostEvent). Con `juez=false`
# y `agente=false` sólo mide recuperación de la KB — gratis (embeddings).

on:
  workflow_dispatch:
    inputs:
      agente:
        description: "Correr el agente real (cuesta tokens)"
        required: false
        default: true
        type: boolean
      juez:
        description: "Correr el juez LLM (cuesta tokens; requiere agente)"
        required: false
        default: true
        type: boolean
      pagina:
        description: "Preguntas por request (≤ 20). Con agente+juez usa 2: Fable 5 tarda 60–120 s por pregunta y Railway corta a los 300 s. Sólo-KB aguanta 20."
        required: false
        default: "2"
        type: string
      ids:
        description: "Subconjunto de ids separados por coma (vacío = todas)"
        required: false
        default: ""
        type: string
      baseUrl:
        description: "URL del despliegue"
        required: false
        default: "https://contabilidad-os-production.up.railway.app"
        type: string

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Correr por páginas
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ inputs.baseUrl }}
          AGENTE: ${{ inputs.agente }}
          JUEZ: ${{ inputs.juez }}
          PAGINA: ${{ inputs.pagina }}
          IDS: ${{ inputs.ids }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${BASE_URL}" | tr -d '[:space:]')"
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::CRON_SECRET vacío"; exit 1; fi
          # `jq -R` sobre entrada VACÍA no emite nada → --argjson recibía "" y
          # reventaba. Con ids vacío la lista es [] explícita.
          IDS_LIMPIO="$(printf '%s' "${IDS}" | tr -d '[:space:]')"
          if [ -z "$IDS_LIMPIO" ]; then IDS_JSON='[]'; else IDS_JSON="$(printf '%s' "$IDS_LIMPIO" | jq -Rc 'split(",")')"; fi
          OFFSET=0; FIN=false; : > resultados.jsonl
          while [ "$FIN" != "true" ]; do
            BODY="$(jq -cn --argjson o "$OFFSET" --argjson l "${PAGINA:-6}" --argjson a "$AGENTE" --argjson j "$JUEZ" --argjson ids "$IDS_JSON" \
              '{offset:$o, limit:$l, agente:$a, juez:$j, ids:$ids}')"
            # Reintentos por página: un 502 puede ser un deploy de Railway
            # cambiando de instancia a media corrida — no tirar 40 minutos por eso.
            RESP=""; for intento in 1 2 3; do
              if RESP="$(curl -fsS --max-time 330 -X POST "${URL}/api/admin/copiloto-eval" \
                -H "Content-Type: application/json" -H "x-cron-secret: ${CRON_SECRET}" -d "$BODY")"; then break; fi
              echo "::warning::página offset=$OFFSET falló (intento $intento); reintento en 30 s"; RESP=""; sleep 30
            done
            if [ -z "$RESP" ]; then echo "::error::página offset=$OFFSET falló 3 veces"; exit 1; fi
            echo "$RESP" | jq -c '.resultados[]' >> resultados.jsonl
            echo "$RESP" | jq '{offset, procesadas, siguiente, fin, ms, resumenPagina}'
            # Errores por pregunta AL MOMENTO (antes sólo se veían en el resumen,
            # que no corre si el job muere a medias).
            echo "$RESP" | jq -r '.resultados[] | select(.error) | "  ✗ \(.id): \(.error)"'
            FIN="$(echo "$RESP" | jq -r '.fin')"
            NEXT="$(echo "$RESP" | jq -r '.siguiente')"
            if [ "$NEXT" = "$OFFSET" ]; then echo "::error::La página no avanzó"; exit 1; fi
            OFFSET="$NEXT"
          done

      - name: Resumen
        if: always()
        run: |
          set -euo pipefail
          [ -s resultados.jsonl ] || { echo "sin resultados"; exit 0; }
          jq -s '{
            n: length,
            conError: map(select(.error)) | length,
            recuperacionHit: (map(select(.error|not)) as $ok | if ($ok|length)==0 then null else (($ok|map(select(.recuperacion.hit))|length) * 100 / ($ok|length) | floor) end),
            citaPresente: (map(select(.respuesta)) as $r | if ($r|length)==0 then null else (($r|map(select(.respuesta.citaPresente))|length) * 100 / ($r|length) | floor) end),
            inventaCitas: (map(select(.respuesta)) as $r | if ($r|length)==0 then null else (($r|map(select((.respuesta.citasFueraDeKB|length)>0))|length) * 100 / ($r|length) | floor) end),
            fundamentoCorrecto: (map(select(.juez)) as $j | if ($j|length)==0 then null else (($j|map(select(.juez.fundamentoCorrecto))|length) * 100 / ($j|length) | floor) end),
            noInventa: (map(select(.juez)) as $j | if ($j|length)==0 then null else (($j|map(select(.juez.noInventa))|length) * 100 / ($j|length) | floor) end),
            respondeLoPreguntado: (map(select(.juez)) as $j | if ($j|length)==0 then null else (($j|map(select(.juez.respondeLoPreguntado))|length) * 100 / ($j|length) | floor) end)
          }' resultados.jsonl | tee resumen.json
          echo "## Eval del copiloto" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat resumen.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # La tabla va al resumen del job Y al log: desde fuera (MCP, curl) sólo
          # se leen los logs, y sin la tabla no se sabe QUÉ pregunta falló.
          {
            echo "| id | KB | cita | inventa | fund. | noInv. | resp. | error |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r '"| \(.id) | \(if .recuperacion.hit then "✓" else "✗" end) | \(if .respuesta then (if .respuesta.citaPresente then "✓" else "✗" end) else "–" end) | \(if .respuesta then (.respuesta.citasFueraDeKB|join(", ")) else "–" end) | \(if .juez then (if .juez.fundamentoCorrecto then "✓" else "✗" end) else "–" end) | \(if .juez then (if .juez.noInventa then "✓" else "✗" end) else "–" end) | \(if .juez then (if .juez.respondeLoPreguntado then "✓" else "✗" end) else "–" end) | \(.error // "") |"' resultados.jsonl
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Fallos de recuperación (esperado → lo que devolvió la KB)"
          jq -r 'select(.recuperacion.hit|not) | "\(.id) esperaba [\(.fundamentos|join(" | "))] → KB: [\(.recuperacion.citas|join(" | "))]"' resultados.jsonl
          echo "### Errores por pregunta"
          jq -r 'select(.error) | "\(.id): \(.error)"' resultados.jsonl
          echo "### Comentarios del juez (fallos)"
          jq -r 'select(.juez and ((.juez.fundamentoCorrecto and .juez.noInventa and .juez.respondeLoPreguntado)|not)) | "\(.id): \(.juez.comentario)"' resultados.jsonl

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copiloto-eval-${{ github.run_id }}
          path: |
            resultados.jsonl
            resumen.json
