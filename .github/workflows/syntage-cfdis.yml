name: CFDIs de Syntage (manual)

# ¿Qué CFDIs tiene Syntage que nosotros no?
#
# La descarga masiva del SAT topa los CFDIs a CINCO AÑOS: lo anterior no se
# puede pedir. MARGOM opera desde 2017-08, así que 2017-2021 es inalcanzable por
# nuestra vía — y Syntage no documenta ese tope.
#
# CUESTA sólo con `extraer: true` (~$10-23 MXN, UNA extraccion aunque cubra
# emitidas + recibidas + todos los años). Sin esa bandera sólo lista lo ya
# extraído, que es gratis.
#
# `importar: true` SÍ ESCRIBE: baja el XML de cada folio que falte y lo mete por
# `importarCfdiXml`, el mismo importador que la descarga masiva del SAT.
#
# La colección son ~1,100 páginas de 100 y una corrida sola alcanza ~113 antes
# de su presupuesto de tiempo, así que esto ITERA con el cursor hasta que la ruta
# devuelve `siguienteCursor: null`, y suma el `porAnio` de todas las vueltas.

on:
  workflow_dispatch:
    inputs:
      companyId:
        description: "ID de la empresa"
        required: true
        type: string
      desde:
        description: "Desde (YYYY-MM-DD). Vacío = inicio de operaciones de la empresa"
        required: false
        default: ""
        type: string
      hasta:
        description: "Hasta (YYYY-MM-DD). Vacío = hoy. Úsalo para acotar un canario a un mes"
        required: false
        default: ""
        type: string
      extraer:
        description: "Disparar la extracción (CUESTA ~$10-23 MXN). Sin esto sólo lista"
        required: false
        default: false
        type: boolean
      importar:
        description: "ESCRIBE: importa los CFDIs que falten (baja su XML)"
        required: false
        default: false
        type: boolean
      baseUrl:
        description: "URL del despliegue a golpear"
        required: false
        default: "https://contabilidad-os-production.up.railway.app"
        type: string

jobs:
  cfdis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Comparar Syntage contra lo nuestro
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ inputs.baseUrl }}
          COMPANY_ID: ${{ inputs.companyId }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          EXTRAER: ${{ inputs.extraer }}
          IMPORTAR: ${{ inputs.importar }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${BASE_URL}" | tr -d '[:space:]')"
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::CRON_SECRET vacío"; exit 1; fi

          Q="companyId=${COMPANY_ID}"
          if [ -n "${DESDE}" ]; then Q="${Q}&desde=$(printf '%s' "${DESDE}" | tr -d '[:space:]')"; fi
          if [ -n "${HASTA}" ]; then Q="${Q}&hasta=$(printf '%s' "${HASTA}" | tr -d '[:space:]')"; fi
          if [ "${IMPORTAR}" = "true" ]; then Q="${Q}&importar=1"; fi

          ACUM="$(mktemp)"
          CURSOR=""
          # Tope de vueltas: ~1,100 páginas / ~113 por corrida ≈ 10, con margen
          # de sobra. Es un seguro contra un cursor que no avance, no una meta.
          for i in $(seq 1 40); do
            Q2="${Q}"
            # `extraer` SÓLO en la primera vuelta: cada extracción se cobra, y
            # dispararla en cada iteración cobraría diez veces por lo mismo.
            if [ "${EXTRAER}" = "true" ] && [ "$i" = "1" ]; then Q2="${Q2}&extraer=1"; fi
            if [ -n "${CURSOR}" ]; then Q2="${Q2}&cursor=${CURSOR}"; fi

            RESP="$(curl -fsS --max-time 330 -X POST "${URL}/api/cron/syntage-cfdis?${Q2}" \
              -H "x-cron-secret: ${CRON_SECRET}")"

            echo "── vuelta ${i}"
            echo "$RESP" | jq -c '{paginas, truncado, totales, importacion, siguienteCursor}'
            echo "$RESP" | jq -c '.porAnio[]' >> "$ACUM"

            if [ "$(echo "$RESP" | jq -r '.extraccion != null')" = "true" ]; then
              echo "::warning::Extracción disparada (asíncrona). Es normal que ahora liste poco: vuelve a correr en unos minutos."
            fi

            CURSOR="$(echo "$RESP" | jq -r '.siguienteCursor // empty')"
            if [ -z "${CURSOR}" ]; then echo "── colección completa"; break; fi
          done

          if [ -n "${CURSOR}" ]; then
            echo "::warning::Se acabaron las vueltas y AÚN queda cursor (${CURSOR}). Lo reportado NO es la colección completa."
          fi

          echo "── por año (suma de todas las vueltas)"
          jq -s '
            group_by(.anio)
            | map({
                anio: .[0].anio,
                enSyntage: (map(.enSyntage) | add),
                yaTenemos: (map(.yaTenemos) | add),
                faltan:    (map(.faltan)    | add),
                conXml:    (map(.conXml)    | add),
                canceladas: (map(.canceladas // 0) | add),
                canceladasNoRegistradas: (map(.canceladasNoRegistradas // 0) | add)
              })
            | sort_by(-.anio)
          ' "$ACUM"

          echo "── totales"
          jq -s '{
            enSyntage: (map(.enSyntage) | add),
            yaTenemos: (map(.yaTenemos) | add),
            faltan:    (map(.faltan)    | add),
            canceladasNoRegistradas: (map(.canceladasNoRegistradas // 0) | add)
          }' "$ACUM"
