name: Cotejo de datos fiscales (semanal)

# Coteja los datos fiscales versionados contra su fuente oficial y marca cada
# dataset verificado cuando empata — sube "sin cotejar" → "al día" en la
# cobertura: INPC vs Banxico SIE (requiere BANXICO_TOKEN; sin él se omite),
# multas vs Anexo 5 RMF, tarifas vs Anexo 8 RMF, recargos vs LIF, UMA vs INEGI
# (requiere INEGI_TOKEN + INEGI_UMA_INDICADORES).
#
# Requiere repo secrets CRON_SECRET y STAGING_URL (igual que los demás crons).
# NOTA: GitHub sólo corre `schedule:` desde la rama por defecto (main).

on:
  schedule:
    - cron: "0 16 * * 1" # lunes ~10:00 CT (el INPC mensual se publica ~día 9)
  workflow_dispatch: {}

jobs:
  cotejo:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar cotejo fiscal (INPC, multas, tarifas, recargos, UMA)
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          curl -fsS -X POST "${URL}/api/cron/cotejo-fiscal" \
            -H "x-cron-secret: ${CRON_SECRET}" | tee response.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
