name: Tests

# Runs the Vitest unit suite (pure fiscal logic — no DB/network needed) on every
# PR and on pushes to main, so a formula change that breaks the tax math turns
# the check red before it merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  # El build de Next también corre en CI: los errores de bundling (p. ej.
  # paquetes node-only arrastrados al bundle edge) no los detecta vitest y
  # antes solo reventaban en el deploy de Railway.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build Next.js
        run: npm run build
