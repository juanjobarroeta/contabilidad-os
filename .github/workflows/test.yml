name: Tests

# Runs the Vitest unit suite (pure fiscal logic — no DB/network needed) on every
# PR and on pushes to main, so a formula change that breaks the tax math turns
# the check red before it merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# `playwright` es devDependency SÓLO para que resuelvan los tipos de
# scripts/recon-sat-portal.ts — un script de reconocimiento que corre una
# persona a mano, nunca CI. Sin esta bandera su postinstall descargaría los
# navegadores (cientos de MB, minutos) en CADA job que hace `npm ci`, para algo
# que aquí no se ejecuta jamás. Va a nivel de workflow: los cuatro jobs
# instalan dependencias.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  # El build de Next también corre en CI: los errores de bundling (p. ej.
  # paquetes node-only arrastrados al bundle edge) no los detecta vitest y
  # antes solo reventaban en el deploy de Railway.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build Next.js
        run: npm run build
        env:
          # El type-check de `next build` revienta el heap default de Node
          # (~2 GB) con el tamaño actual del código; el runner tiene de sobra.
          NODE_OPTIONS: --max-old-space-size=6144

  # Escaneo de secretos sobre TODO el historial en cada PR (23 MB, <1s: barato).
  # Complementa el hook local de lefthook — este es el que nadie puede saltarse.
  # Historial base auditado limpio el 2026-08-16 (docs/security/secret-scan-2026-08-16.md).
  secrets:
    runs-on: ubuntu-latest
    # En un PR, gitleaks-action lista los commits del PR por la API
    # (GET /repos/{owner}/{repo}/pulls/{n}/commits) para saber qué escanear.
    # El GITHUB_TOKEN de este repo viene restringido por default, así que sin
    # este bloque la llamada responde 403 «Resource not accessible by
    # integration» y el job truena ANTES de escanear nada — rojo en todos los
    # PRs, y peor: un rojo que parece un hallazgo de secretos sin serlo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # P0-2b: el choke point del multi-tenant (src/lib/authz.ts) probado contra
  # Postgres REAL — membresía directa, capa despacho, scoping por miembro,
  # operador, pisos de rol y camino bearer completo. Corre aparte de `test`
  # para que la suite pura siga sin dependencias. REQUIRE_DB_TESTS=1 convierte
  # cualquier skip silencioso en error del job.
  authz-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: contabilidad_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:prueba@localhost:5432/contabilidad_os_test
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Preparar la base de prueba (extensión + esquema)
        run: |
          psql "$TEST_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector'
          npx prisma generate
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:prueba@localhost:5432/contabilidad_os_test
      - name: Tests de integración de authz
        run: npm run test:db

  # Guardia anti-drift: un PR que toque prisma/schema.prisma SIN su migración
  # correspondiente falla aquí (con prisma migrate, un cambio de schema sin
  # migración se "aplica" en generate pero nunca llega a la base → drift
  # silencioso y errores en runtime). Requiere un Postgres sombra para
  # reproducir las migraciones.
  drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Comprobar que las migraciones producen exactamente el schema
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://postgres:shadow@localhost:5432/shadow
          --exit-code
