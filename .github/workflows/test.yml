name: Tests

# Runs the Vitest unit suite (pure fiscal logic — no DB/network needed) on every
# PR and on pushes to main, so a formula change that breaks the tax math turns
# the check red before it merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  # El build de Next también corre en CI: los errores de bundling (p. ej.
  # paquetes node-only arrastrados al bundle edge) no los detecta vitest y
  # antes solo reventaban en el deploy de Railway.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build Next.js
        run: npm run build

  # Guardia anti-drift: un PR que toque prisma/schema.prisma SIN su migración
  # correspondiente falla aquí (con prisma migrate, un cambio de schema sin
  # migración se "aplica" en generate pero nunca llega a la base → drift
  # silencioso y errores en runtime). Requiere un Postgres sombra para
  # reproducir las migraciones.
  drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Comprobar que las migraciones producen exactamente el schema
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://postgres:shadow@localhost:5432/shadow
          --exit-code
