name: Repescar meses del SAT (manual)

# Vuelve a pedirle al SAT los CFDIs de periodos ESPECÍFICOS.
#
# sat-backfill no puede: salta cualquier mes ya marcado hecho, y lo marca hecho
# cuando las dos solicitudes llegan a FINISHED — sin importar cuántas facturas
# entraron. Así se quedaron ocho meses de MARGOM, cada uno pedido, devuelto
# FINISHED, importado casi vacío y marcado «hecho» para siempre:
#
#   2022-01  63 fact  $27,304.54     2023-08  AUSENTE
#   2022-02  49       $27,337.65     2024-01  36 fact  $1,482,667.27
#   2022-03  80       $35,500.62     2025-04  AUSENTE
#   2022-05  47       $21,878.58
#   2022-06   3       $2,078.37
#
# ~$500M de ingreso y ~5,200 facturas. Las unidades vendidas en esos meses nunca
# se dieron de baja: es una de las dos causas del piso inflado.
#
# CUIDADO CON LA CUOTA. El SAT limita las solicitudes DE POR VIDA por
# (RFC + rango + tipo) y esperar NO la libera. Corre primero con dryRun.
#
# MEDIDO: el mes COMPLETO de 2025-04 devuelve 5002 en emitidos y en recibidos.
# Por eso `tramos` viene en 2 por default — la cuota se cuenta por rango, así que
# medio mes es otra llave. Cuesta 2 solicitudes por tramo.

on:
  workflow_dispatch:
    inputs:
      companyId:
        description: "ID de la empresa"
        required: true
        type: string
      periodos:
        description: "Meses a repescar, separados por coma (YYYY-MM)"
        required: true
        default: "2025-04,2023-08,2024-01"
        type: string
      tramos:
        description: "Partir cada mes en N rangos (la cuota 5002 es por rango). 1 = mes completo"
        required: false
        default: "2"
        type: string
      saltarTramos:
        description: "Saltar los primeros N tramos (un tramo ya completo se come el presupuesto)"
        required: false
        default: "0"
        type: string
      metadata:
        description: "Pedir METADATA en vez de XML (el 301 del SAT habla sólo de Xml; esto pregunta si metadata tiene el mismo tope)"
        required: false
        default: false
        type: boolean
      dryRun:
        description: "Sólo decir qué haría, sin gastar solicitudes"
        required: false
        default: true
        type: boolean
      baseUrl:
        description: "URL del despliegue a golpear"
        required: false
        default: "https://contabilidad-os-production.up.railway.app"
        type: string

jobs:
  repesca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repescar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ inputs.baseUrl }}
          COMPANY_ID: ${{ inputs.companyId }}
          PERIODOS: ${{ inputs.periodos }}
          TRAMOS: ${{ inputs.tramos }}
          SALTAR: ${{ inputs.saltarTramos }}
          METADATA: ${{ inputs.metadata }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${BASE_URL}" | tr -d '[:space:]')"
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::CRON_SECRET vacío"; exit 1; fi

          Q="companyId=${COMPANY_ID}&periodos=$(printf '%s' "${PERIODOS}" | tr -d '[:space:]')"
          Q="${Q}&tramos=$(printf '%s' "${TRAMOS:-1}" | tr -d '[:space:]')"
          Q="${Q}&saltarTramos=$(printf '%s' "${SALTAR:-0}" | tr -d '[:space:]')"
          if [ "${METADATA}" = "true" ]; then Q="${Q}&metadata=1"; fi
          if [ "${DRY_RUN}" = "true" ]; then Q="${Q}&dryRun=1"; fi

          RESP="$(curl -fsS --max-time 330 -X POST "${URL}/api/cron/sat-repesca?${Q}" \
            -H "x-cron-secret: ${CRON_SECRET}")"
          echo "$RESP" | jq '{dryRun, periodosPedidos, resultados, cuotaAgotada, nota}'

          # Un tramo `pendiente` no es un fallo: la solicitud quedó viva y
          # re-correr no gasta cuota. Avisar para que se vuelva a lanzar.
          if [ "$(echo "$RESP" | jq -r '[.resultados[].tramos[]?|select(.pendiente)]|length')" != "0" ]; then
            echo "::warning::Quedaron tramos pendientes de verificar. Vuelve a correrlo: es gratis."
          fi

          # La cuota vitalicia no se libera esperando: si se agotó, avisar fuerte
          # para no volver a intentarlo por la misma vía.
          if [ "$(echo "$RESP" | jq -r '.cuotaAgotada')" = "true" ]; then
            echo "::warning::SAT 5002 — cuota agotada en algún rango. Sube tramos, o usa Syntage."
          fi
