name: Compliance provision (Syntage, diario)

# Aprovisiona en Syntage todas las empresas con e.firma (entidad + credencial) y
# dispara extracciones frescas. Corre antes que compliance-sync (que lee y
# persiste). Idempotente. Requiere SYNTAGE_API_KEY en el deploy y
# CRON_SECRET/STAGING_URL en el repo.
#
# NOTE: GitHub solo corre schedule: desde la rama default (main).

on:
  schedule:
    - cron: "0 11 * * *" # ~05:00 CT, antes del sync de las 13:00 UTC
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Provision + kick extracciones
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          curl -fsS -X POST "${URL}/api/cron/compliance-provision" -H "x-cron-secret: ${CRON_SECRET}" | tee response.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
