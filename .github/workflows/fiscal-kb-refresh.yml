name: Fiscal KB refresh (weekly re-ingest)

# Keeps the narrative KB fresh: re-ingests the self-updating sources so reforms
# are picked up within days of publication. Ingesta is idempotent (content-hash)
# — unchanged sources are skipped, so re-running weekly is cheap; only a
# changed law re-embeds.
#
# Desde docs/MOTOR-JURIDICO.md F0 la lista de leyes ya no vive aquí: el
# endpoint recorre TODO el catálogo (catalogo/federal.json + manuales.ts, 320+
# ordenamientos) por lotes con presupuesto de tiempo y devuelve `siguiente`
# hasta terminar. Las guías del SAT siguen como jobs sueltos.
#
# Requires repo secrets CRON_SECRET and STAGING_URL (same as the other crons).
#
# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch (main).
# Use "Run workflow" (workflow_dispatch) to trigger manually.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays ~00:00 CT (UTC-6)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-chunk y re-embed aunque el texto no haya cambiado (úsalo cuando el chunker aprende algo; cuesta embeddings)"
        required: false
        default: false
        type: boolean
      soloFaltantes:
        description: "Carga inicial: sólo claves sin ninguna versión en la base (no descarga lo ya cargado)"
        required: false
        default: false
        type: boolean
      baseUrl:
        description: "URL del despliegue (vacío = secret STAGING_URL)"
        required: false
        default: ""
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FORCE: ${{ inputs.force }}
      SOLO_FALTANTES: ${{ inputs.soloFaltantes }}
      BASE_URL_INPUT: ${{ inputs.baseUrl }}
    steps:
      - name: Catálogo completo por lotes (idempotente, versionado)
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${BASE_URL_INPUT:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"; fi
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::CRON_SECRET vacío"; exit 1; fi
          FORCE_JSON=false; if [ "${FORCE:-false}" = "true" ]; then FORCE_JSON=true; fi
          SOLO_JSON=false; if [ "${SOLO_FALTANTES:-false}" = "true" ]; then SOLO_JSON=true; fi
          OFFSET=0; VUELTA=0; ING=0; SIN=0; FALL=0
          while :; do
            VUELTA=$((VUELTA+1))
            BODY="{\"catalogo\":{\"offset\":${OFFSET},\"presupuestoSegundos\":200,\"force\":${FORCE_JSON},\"soloFaltantes\":${SOLO_JSON}}}"
            RESP=""; for intento in 1 2 3; do
              # -f apagado a propósito: un lote con fallos responde 207 y trae el detalle.
              if RESP="$(curl -sS --max-time 330 -X POST "${URL}/api/admin/fiscal-ingest" \
                -H "Content-Type: application/json" -H "x-cron-secret: ${CRON_SECRET}" -d "$BODY")" \
                && echo "$RESP" | jq -e '.procesadas != null' >/dev/null 2>&1; then break; fi
              echo "::warning::vuelta $VUELTA falló (intento $intento): ${RESP:0:300}; reintento en 30 s"; RESP=""; sleep 30
            done
            if [ -z "$RESP" ]; then echo "::error::vuelta $VUELTA falló 3 veces"; exit 1; fi
            echo "$RESP" | jq -c '{vuelta: '"$VUELTA"', procesadas, ingeridas, sinCambios, fallidas, siguiente, restantes, ms}'
            echo "$RESP" | jq -r '.resultados[] | select(.ok and (.skipped|not)) | "  ✓ \(.clave): \(.chunkCount) chunks (\(.unidades) unidades), vigente desde \(.vigenciaDesde)"'
            echo "$RESP" | jq -r '.resultados[] | select(.ok|not) | "::warning::\(.clave): \(.error)"'
            ING=$((ING + $(echo "$RESP" | jq -r '.ingeridas')))
            SIN=$((SIN + $(echo "$RESP" | jq -r '.sinCambios')))
            FALL=$((FALL + $(echo "$RESP" | jq -r '.fallidas')))
            SIG="$(echo "$RESP" | jq -r '.siguiente')"
            if [ "$SIG" = "null" ]; then break; fi
            OFFSET="$SIG"
            if [ "$VUELTA" -ge 150 ]; then echo "::error::150 vueltas y el catálogo no termina (siguiente=$SIG)"; exit 1; fi
          done
          echo "Catálogo: $ING ingeridas, $SIN sin cambios, $FALL fallidas en $VUELTA vueltas"
          if [ "$FALL" -gt 0 ]; then echo "::warning::$FALL fuentes fallaron (ver arriba); el resto quedó al día"; fi

      - name: Guías del SAT (jobs sueltos)
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${BASE_URL_INPUT:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"; fi
          FORCE_FRAG=""; if [ "${FORCE:-false}" = "true" ]; then FORCE_FRAG=',"force":true'; fi
          for clave in GUIA-PAGOS GUIA-CFDI-GLOBAL; do
            echo "→ ingest doc ${clave}"
            curl -sS -X POST "${URL}/api/admin/fiscal-ingest" \
              -H "x-cron-secret: ${CRON_SECRET}" -H "content-type: application/json" \
              -d "{\"jobs\":[{\"type\":\"doc\",\"clave\":\"${clave}\"${FORCE_FRAG}}]}" | jq -c '.results[] | {clave, ok, skipped, chunkCount, error}'
          done
