name: SAT backfill (hourly)

# Drives the throttled 5-year historical CFDI backfill. Resumes each run and
# auto-stops per company once satBackfillCompletedAt is set, so it safely
# no-ops once history is filled.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET  — same value as the app's CRON_SECRET env var
#   STAGING_URL  — e.g. https://contabilidad-os-staging.up.railway.app
#
# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch (main).
# Until this is merged to main it stays dormant; use "Run workflow" or the
# manual curl to exercise it in the meantime.

on:
  schedule:
    - cron: "0 * * * *" # top of every hour (UTC)
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SAT backfill
        run: |
          set -euo pipefail
          # A trailing newline/space in the STAGING_URL secret makes curl reject
          # the URL ("Malformed input to a URL function"), and without pipefail
          # the `| tee` masks that failure as success. Strip whitespace and fail
          # loudly so a broken sync is actually visible.
          URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          curl -fsS -X POST "${URL}/api/cron/sat-backfill" \
            -H "x-cron-secret: ${CRON_SECRET}" | tee response.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
