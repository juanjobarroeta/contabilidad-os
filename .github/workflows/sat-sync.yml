name: SAT incremental sync (3x weekdays)

# Ongoing incremental CFDI sync — current month + previous couple of months,
# to catch late-arriving recibidos. Separate from the historical backfill.
#
# /api/cron/sat-sync es a la vez la sincronización de CFDIs y, por su ventana
# de reúso de 24h (REUSE_WINDOW_HOURS), es seguro correrla varias veces al día:
# no genera nuevas solicitudes al SAT (reusa la del día) — sólo levanta los
# paquetes que el SAT ya terminó de preparar. Cada corrida importa CFDIs más
# frescos y dispara la conciliación bancaria event-driven por empresa. Por eso
# NO hace falta un endpoint "CFDI-only" aparte: este mismo es la fuente única.
#
# Cadencia: ~07:00, ~13:00 y ~18:00 CT en días hábiles (L-V). Minutos fuera del
# :00 para no caer en el pico de schedulers de GitHub. CT = UTC-6.
#
# Requires repo secrets CRON_SECRET and STAGING_URL (see sat-backfill.yml).
#
# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch (main).

on:
  schedule:
    # 07:07 CT = 13:07 UTC
    - cron: "7 13 * * 1-5"
    # 13:07 CT = 19:07 UTC
    - cron: "7 19 * * 1-5"
    # 18:07 CT = 00:07 UTC del día siguiente (por eso 2-6: mar-sáb UTC = lun-vie CT)
    - cron: "7 0 * * 2-6"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SAT incremental sync
        run: |
          set -euo pipefail
          # A trailing newline/space in the STAGING_URL secret makes curl reject
          # the URL ("Malformed input to a URL function"), and without pipefail
          # the `| tee` masks that failure as success. Strip whitespace and fail
          # loudly so a broken sync is actually visible.
          URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          curl -fsS -X POST "${URL}/api/cron/sat-sync" \
            -H "x-cron-secret: ${CRON_SECRET}" | tee response.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Tras sincronizar los XML vigentes, detecta cancelaciones en el SAT
      # (descarga de metadata) y revierte su efecto. Asíncrono como el sync: lo
      # que no esté listo se resuelve en la siguiente corrida.
      - name: Trigger SAT cancel-sync (detectar cancelaciones)
        run: |
          set -euo pipefail
          URL="$(printf '%s' "${STAGING_URL:-}" | tr -d '[:space:]')"
          if [ -z "$URL" ]; then echo "::error::STAGING_URL secret is empty"; exit 1; fi
          curl -fsS -X POST "${URL}/api/cron/sat-cancel-sync" \
            -H "x-cron-secret: ${CRON_SECRET}" | tee cancel-response.json
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
