name: Memory Engine

# El archivo autobiográfico vive en memory-engine/ como app INDEPENDIENTE: su
# propio package.json, su propio node_modules, su propio esquema de Prisma y su
# propia base. Por eso no lo cubre ningún job de test.yml — `npm ci` de la raíz
# ni siquiera instala sus dependencias.
#
# Sólo corre cuando cambia memory-engine/, así que no le cuesta nada a los PRs
# fiscales.

on:
  pull_request:
    paths: ["memory-engine/**", ".github/workflows/memory-engine.yml"]
  push:
    branches: [main]
    paths: ["memory-engine/**", ".github/workflows/memory-engine.yml"]

defaults:
  run:
    working-directory: memory-engine

jobs:
  # Lógica pura: fechado incierto, validación de entrada, agrupación por año,
  # render del export. Sin base, sin red.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: memory-engine/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  # La garantía central del proyecto —que `episodes` es append-only— la impone
  # Postgres, no TypeScript, así que sólo se puede probar contra un Postgres de
  # verdad. REQUIRE_DB_TESTS=1 convierte un skip silencioso en job rojo.
  #
  # Postgres pelón a propósito: si Phase 1 necesitara pgvector para arrancar,
  # sería una dependencia que el outline explícitamente no quiere todavía.
  invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: memory_engine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:prueba@localhost:5432/memory_engine_test
      MEMORY_TEST_DATABASE_URL: postgresql://postgres:prueba@localhost:5432/memory_engine_test
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: memory-engine/package-lock.json
      - run: npm ci
      - name: Aplicar migraciones
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Probar que la columna vertebral no se puede reescribir
        run: npm run test:db

  # Mismo guardia anti-drift que test.yml aplica al esquema fiscal: un cambio en
  # schema.prisma sin su migración se "aplica" en generate pero nunca llega a la
  # base. Aquí importa más: la migración inicial lleva triggers y CHECKs escritos
  # a mano que Prisma no puede regenerar solo.
  drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: memory-engine/package-lock.json
      - run: npm ci
      - name: Comprobar que las migraciones producen exactamente el schema
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://postgres:shadow@localhost:5432/shadow
          --exit-code
