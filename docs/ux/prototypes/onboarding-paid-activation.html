.form-range::-moz-range-track {

}

.form-range::-moz-range-thumb {

  height: 20px;

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {
  cursor: not-allowed;

}

}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    height: 44px;
  }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;cos-onboarding-no-trial&quot;);
      const steps = [...root.querySelectorAll(&quot;[data-step]&quot;)];
      const screens = [...root.querySelectorAll(&quot;[data-screen]&quot;)];
      const plans = [...root.querySelectorAll(&quot;[data-plan]&quot;)];
      const periods = [...root.querySelectorAll(&quot;[data-period]&quot;)];
      const legalChecks = [...root.querySelectorAll(&quot;[data-legal]&quot;)];
      const efirmaChecks = [...root.querySelectorAll(&quot;[data-efirma]&quot;)];
      const back = root.querySelector(&quot;#cos-back&quot;);
      const next = root.querySelector(&quot;#cos-next&quot;);
      const note = root.querySelector(&quot;[data-action-note]&quot;);
      const stripeDialog = root.querySelector(&quot;[data-stripe-dialog]&quot;);
      const basicPrice = root.querySelector(&quot;[data-price-basic]&quot;);
      const professionalPrice = root.querySelector(&quot;[data-price-professional]&quot;);
      const orderPlan = root.querySelector(&quot;[data-order-plan]&quot;);
      const orderSubtotal = root.querySelector(&quot;[data-order-subtotal]&quot;);
      const orderTax = root.querySelector(&quot;[data-order-tax]&quot;);
      const orderTotal = root.querySelector(&quot;[data-order-total]&quot;);
      const renewalCopy = root.querySelector(&quot;[data-renewal-copy]&quot;);
      const dialogPlan = root.querySelector(&quot;[data-dialog-plan]&quot;);
      const dialogTotal = root.querySelector(&quot;[data-dialog-total]&quot;);
      const summaryPlan = root.querySelector(&quot;[data-summary-plan]&quot;);
      let active = 0;
      let selectedPlan = &quot;professional&quot;;
      let selectedPeriod = &quot;monthly&quot;;
      let paymentConfirmed = false;

      const pricing = {
        basic: { monthly: { subtotal: 499, tax: 79.84, total: 578.84 }, annual: { subtotal: 4990, tax: 798.4, total: 5788.4 } },
        professional: { monthly: { subtotal: 1299, tax: 207.84, total: 1506.84 }, annual: { subtotal: 12990, tax: 2078.4, total: 15068.4 } },
      };
      const actionNotes = [
        &quot;Acepta ambos documentos para continuar.&quot;,
        &quot;La e.firma no se solicita hasta después de confirmar el pago.&quot;,
        &quot;Serás redirigido a Stripe; ContabilidadOS no recibe los datos de la tarjeta.&quot;,
        &quot;Autoriza el uso limitado de la e.firma para iniciar la sincronización.&quot;,
        &quot;La descarga continuará aunque entres a la aplicación.&quot;,

      const formatMoney = (value) =&gt; new Intl.NumberFormat(&quot;es-MX&quot;, { style: &quot;currency&quot;, currency: &quot;MXN&quot;, minimumFractionDigits: 2 }).format(value) + &quot; MXN&quot;;
      const allChecked = (collection) =&gt; collection.every((input) =&gt; input.checked);

      function refreshPurchase() {
        plans.forEach((plan) =&gt; plan.setAttribute(&quot;aria-pressed&quot;, String(plan.dataset.plan === selectedPlan)));

        const planName = selectedPlan === &quot;professional&quot; ? &quot;Profesional&quot; : &quot;Básico&quot;;
        const periodName = annual ? &quot;anual&quot; : &quot;mensual&quot;;
        const current = pricing[selectedPlan][selectedPeriod];
        basicPrice.innerHTML = annual ? &quot;$4,990 &lt;small&gt;MXN al año&lt;/small&gt;&quot; : &quot;$499 &lt;small&gt;MXN al mes&lt;/small&gt;&quot;;
        professionalPrice.innerHTML = annual ? &quot;$12,990 &lt;small&gt;MXN al año&lt;/small&gt;&quot; : &quot;$1,299 &lt;small&gt;MXN al mes&lt;/small&gt;&quot;;
        orderPlan.textContent = `${planName} ${periodName}`;
        orderSubtotal.textContent = formatMoney(current.subtotal);
        orderTax.textContent = formatMoney(current.tax);
        orderTotal.textContent = formatMoney(current.total);
        dialogPlan.textContent = `${planName} ${periodName}`;
        dialogTotal.textContent = formatMoney(current.total);
        summaryPlan.textContent = planName;
        renewalCopy.textContent = annual ? &quot;Renovación anual. Puedes cancelar antes del siguiente cargo.&quot; : &quot;Renovación mensual. Puedes cancelar antes del siguiente cargo.&quot;;
      }

      function refreshActions() {
        back.disabled = active === 0;
        next.disabled = active === 0 ? !allChecked(legalChecks) : active === 3 ? !allChecked(efirmaChecks) : false;
        next.textContent = active === 2 ? paymentConfirmed ? &quot;Pago confirmado&quot; : &quot;Continuar a Stripe&quot; : active === 3 ? &quot;Validar e iniciar importación&quot; : active === 4 ? &quot;Abrir inicio&quot; : &quot;Continuar&quot;;
        note.textContent = actionNotes[active];
      }

      function show(index) {
        active = Math.max(0, Math.min(4, index));
        steps.forEach((step, i) =&gt; {
          step.setAttribute(&quot;aria-selected&quot;, String(i === active));
          step.dataset.complete = String(i &lt; active || (i === 2 &amp;&amp; paymentConfirmed));
        });
        screens.forEach((screen, i) =&gt; { screen.hidden = i !== active; });
        refreshActions();
      }

      function openStripe() {
        stripeDialog.hidden = false;
        root.querySelector(&quot;[data-stripe-cancel]&quot;).focus();
      }

      function closeStripe() {
        stripeDialog.hidden = true;
        next.focus();
      }

      steps.forEach((step) =&gt; step.addEventListener(&quot;click&quot;, () =&gt; show(Number(step.dataset.step))));
      legalChecks.forEach((input) =&gt; input.addEventListener(&quot;change&quot;, refreshActions));
      efirmaChecks.forEach((input) =&gt; input.addEventListener(&quot;change&quot;, refreshActions));
      plans.forEach((plan) =&gt; plan.addEventListener(&quot;click&quot;, () =&gt; { selectedPlan = plan.dataset.plan; paymentConfirmed = false; refreshPurchase(); refreshActions(); }));
      periods.forEach((period) =&gt; period.addEventListener(&quot;click&quot;, () =&gt; { selectedPeriod = period.dataset.period; paymentConfirmed = false; refreshPurchase(); refreshActions(); }));
      root.querySelectorAll(&quot;[data-document]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
        note.textContent = button.dataset.document === &quot;terms&quot; ? &quot;Vista previa de los Términos y Condiciones vigentes.&quot; : &quot;Vista previa del Aviso de Privacidad vigente.&quot;;
      }));
      root.querySelector(&quot;[data-upload-csf]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        root.querySelector(&quot;[data-csf-title]&quot;).textContent = &quot;Constancia seleccionada&quot;;
        root.querySelector(&quot;[data-csf-detail]&quot;).textContent = &quot;constancia-fiscal.pdf · Lista para revisión&quot;;

      root.querySelector(&quot;[data-stripe-cancel]&quot;).addEventListener(&quot;click&quot;, closeStripe);
      root.querySelector(&quot;[data-stripe-confirm]&quot;).addEventListener(&quot;click&quot;, () =&gt; { paymentConfirmed = true; stripeDialog.hidden = true; show(3); });
      stripeDialog.addEventListener(&quot;click&quot;, (event) =&gt; { if (event.target === stripeDialog) closeStripe(); });
      root.addEventListener(&quot;keydown&quot;, (event) =&gt; { if (event.key === &quot;Escape&quot; &amp;&amp; !stripeDialog.hidden) closeStripe(); });
      back.addEventListener(&quot;click&quot;, () =&gt; show(active - 1));
      next.addEventListener(&quot;click&quot;, () =&gt; {
        if (active === 2 &amp;&amp; !paymentConfirmed) { openStripe(); return; }
        show(active === 4 ? 0 : active + 1);
      });
      refreshPurchase();
      show(0);
    })();
  &lt;/script&gt;

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    }
