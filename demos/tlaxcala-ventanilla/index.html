<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventanilla Digital Tlaxcala — Maqueta</title>
<style>
  :root{
    --guinda:#7A1830;
    --guinda-2:#9F2241;
    --guinda-deep:#43101F;
    --dorado:#BC955C;
    --dorado-pale:#F4EBDD;
    --verde:#1E5B4F;
    --verde-pale:#E4EFEB;
    --ambar:#8A6215;
    --ambar-pale:#F7EEDA;
    --rojo:#A3341F;
    --rojo-pale:#F8E7E2;
    --ink:#2B1F24;
    --muted:#7C6C72;
    --paper:#FAF8F6;
    --card:#FFFFFF;
    --line:#E9DFDB;
    --shadow:0 1px 2px rgba(43,31,36,.06),0 6px 18px rgba(43,31,36,.07);
    --radius:10px;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.6}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit}
  a{color:var(--guinda-2)}
  :focus-visible{outline:3px solid var(--dorado);outline-offset:2px;border-radius:4px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- chrome ---------- */
  .govbar{background:var(--guinda-deep);color:#E9D5C3;font-size:12.5px;letter-spacing:.04em}
  .govbar .wrap{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
  .govbar a{color:#E9D5C3;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  header.site{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  header.site .wrap{display:flex;align-items:center;gap:22px;height:66px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex:none}
  .brand b{display:block;font-size:15px;letter-spacing:.01em;line-height:1.25;white-space:nowrap}
  .brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  nav.main{display:flex;gap:4px;margin-left:8px}
  nav.main a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px}
  nav.main a:hover{background:var(--dorado-pale)}
  nav.main a.on{background:var(--guinda);color:#fff}
  .spacer{flex:1}
  .demo-pill{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ambar);background:var(--ambar-pale);border:1px solid #E3CD9C;padding:4px 10px;border-radius:99px;white-space:nowrap}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none;transition:filter .15s}
  .btn:hover{filter:brightness(1.08)}
  .btn-guinda{background:var(--guinda);color:#fff}
  .btn-gold{background:var(--dorado);color:#fff}
  .btn-ghost{background:transparent;color:var(--guinda);border:1.5px solid var(--guinda)}
  .btn-quiet{background:#F1EAE6;color:var(--ink)}
  .btn-verde{background:var(--verde);color:#fff}
  .btn-rojo{background:var(--rojo);color:#fff}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
  .btn.lg{padding:13px 24px;font-size:15px}
  .userchip{display:flex;align-items:center;gap:10px;background:var(--dorado-pale);border:1px solid #E4D3B8;border-radius:99px;padding:5px 14px 5px 6px;font-size:13px;font-weight:600}
  .userchip .avatar{width:28px;height:28px;border-radius:50%;background:var(--guinda);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
  .userchip button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline}

  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dorado)}
  h1{font-size:34px;line-height:1.2;font-weight:700;text-wrap:balance}
  h2{font-size:23px;font-weight:700;text-wrap:balance}
  h3{font-size:16.5px;font-weight:700}
  .lead{font-size:16.5px;color:#584A50;max-width:60ch}

  /* ---------- hero ---------- */
  .hero{background:linear-gradient(160deg,var(--guinda-deep) 0%,var(--guinda) 55%,var(--guinda-2) 100%);color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:54px solid rgba(188,149,92,.16)}
  .hero::before{content:"";position:absolute;right:120px;bottom:-180px;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.05)}
  .hero .wrap{padding:56px 22px 50px;position:relative;z-index:1}
  .hero .eyebrow{color:#E2C58F}
  .hero h1{color:#fff;max-width:19ch;margin:10px 0 14px}
  .hero p{color:#F2DFE3;max-width:56ch;font-size:16.5px}
  .searchbox{margin-top:26px;display:flex;max-width:640px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .searchbox input{flex:1;border:none;padding:16px 18px;font-size:15.5px;color:var(--ink)}
  .searchbox input:focus{outline:none}
  .searchbox button{border:none;background:var(--dorado);color:#fff;font-weight:700;padding:0 26px;font-size:15px}
  .hero .hints{margin-top:12px;font-size:13px;color:#E5C9CE}
  .hero .hints a{color:#fff;text-decoration:underline;text-underline-offset:3px}
  .statrow{display:flex;gap:0;margin-top:38px;max-width:720px;border-top:1px solid rgba(255,255,255,.22);padding-top:22px}
  .stat{flex:1;padding-right:24px}
  .stat b{display:block;font-size:27px;font-weight:700;color:#fff}
  .stat span{font-size:12.5px;color:#E2C58F;letter-spacing:.05em;text-transform:uppercase}

  section.band{padding:46px 0}
  section.band.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .band-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media (max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}.statrow{flex-wrap:wrap}.stat{flex:1 1 40%;margin-bottom:14px}}
  @media (max-width:620px){.grid3,.grid4{grid-template-columns:1fr}nav.main{display:none}}
  @media (max-width:760px){.demo-pill{display:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .tcard{padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s, transform .15s}
  .tcard:hover{border-color:var(--dorado);transform:translateY(-2px)}
  .tcard .dep{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--guinda-2)}
  .tcard h3{font-size:15.5px;line-height:1.35}
  .tcard .meta{display:flex;gap:14px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2.5px 8px}
  .tag.linea{background:var(--verde-pale);color:var(--verde)}
  .tag.rev{background:var(--ambar-pale);color:var(--ambar)}

  .step3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:760px){.step3{grid-template-columns:1fr}}
  .step{padding:22px;position:relative}
  .step .n{width:34px;height:34px;border-radius:50%;background:var(--guinda);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:12px}
  .step p{font-size:13.5px;color:var(--muted);margin-top:6px}

  .expbanner{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center}
  @media (max-width:760px){.expbanner{grid-template-columns:1fr}}
  .doclist-mini{display:flex;flex-direction:column;gap:8px}
  .doclist-mini .d{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13.5px;box-shadow:var(--shadow)}
  .sello{width:20px;height:20px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-size:11px;flex:none}

  footer.site{background:var(--guinda-deep);color:#D9BFC6;margin-top:56px}
  footer.site .wrap{padding:36px 22px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;font-size:13px}
  @media (max-width:760px){footer.site .wrap{grid-template-columns:1fr}}
  footer.site h4{color:#fff;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  footer.site a{color:#D9BFC6;text-decoration:none;display:block;padding:2.5px 0}
  footer.site a:hover{color:#fff}
  .conformidad{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .conformidad span{border:1px solid rgba(188,149,92,.5);color:#E2C58F;font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:6px}
  .legalfoot{border-top:1px solid rgba(255,255,255,.14);padding:14px 22px;font-size:11.5px;color:#B78F99;text-align:center}

  /* ---------- catálogo ---------- */
  .pagehead{background:#fff;border-bottom:1px solid var(--line);padding:30px 0}
  .filters{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#fff;min-width:220px}
  .filters input{flex:1;min-width:260px}
  .cat-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:28px 0}
  @media (max-width:900px){.cat-list{grid-template-columns:1fr 1fr}}
  @media (max-width:620px){.cat-list{grid-template-columns:1fr}}
  .count{color:var(--muted);font-size:13px}

  /* ---------- ficha ---------- */
  .ficha{display:grid;grid-template-columns:1fr 340px;gap:26px;padding:30px 0;align-items:start}
  @media (max-width:860px){.ficha{grid-template-columns:1fr}}
  .ficha-main{padding:26px}
  .ficha-main .dep{color:var(--guinda-2);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .ficha-main h1{font-size:26px;margin:8px 0 12px}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:18px 0}
  .kv div{background:#FDFBFA;padding:12px 16px}
  .kv b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
  .req{list-style:none;display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
  .req li{display:flex;gap:10px;align-items:start;font-size:14px;background:#FDFBFA;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  .req .exp{margin-left:auto;flex:none}
  .fund{font-size:12.5px;color:var(--muted);border-left:3px solid var(--dorado);padding:6px 0 6px 14px;margin-top:18px}
  .ficha-side{padding:22px;position:sticky;top:86px}
  .precio{font-size:30px;font-weight:700;color:var(--guinda)}
  .precio small{font-size:13px;color:var(--muted);font-weight:500}
  .ficha-side .btn{width:100%;justify-content:center;margin-top:14px}
  .llavemx-note{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin-top:14px;align-items:start}

  /* ---------- wizard ---------- */
  .wizhead{background:#fff;border-bottom:1px solid var(--line);padding:22px 0}
  .wizsteps{display:flex;gap:0;margin-top:18px;max-width:760px}
  .ws{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--muted);padding-top:30px}
  .ws::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#EDE4E0;color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:12px}
  .ws::after{content:"";position:absolute;top:12px;left:calc(50% + 16px);width:calc(100% - 32px);height:2px;background:#EDE4E0}
  .ws:last-child::after{display:none}
  .ws.done::before{background:var(--verde);color:#fff;content:"✓"}
  .ws.done::after{background:var(--verde)}
  .ws.now{color:var(--guinda);font-weight:700}
  .ws.now::before{background:var(--guinda);color:#fff}
  .wizbody{max-width:760px;margin:26px auto;padding:0 22px}
  .wizcard{padding:26px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:16px}
  @media (max-width:620px){.fgrid{grid-template-columns:1fr}}
  .f label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
  .f input,.f select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
  .f input[readonly]{background:var(--dorado-pale);border-color:#E4D3B8;font-weight:600}
  .prefill{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--verde);background:var(--verde-pale);border-radius:8px;padding:9px 14px;margin-top:14px}
  .wizbtns{display:flex;justify-content:space-between;margin-top:22px}
  .docrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;padding:13px 16px;margin-top:10px;background:#fff}
  .docrow .ic{width:38px;height:38px;border-radius:8px;background:var(--dorado-pale);display:grid;place-items:center;font-size:17px;flex:none}
  .docrow b{font-size:14px;display:block}
  .docrow small{color:var(--muted);font-size:12px}
  .docrow .st{margin-left:auto;flex:none;text-align:right}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3.5px 11px}
  .pill.ok{background:var(--verde-pale);color:var(--verde)}
  .pill.wait{background:var(--ambar-pale);color:var(--ambar)}
  .pill.err{background:var(--rojo-pale);color:var(--rojo)}
  .pill.info{background:#EAE3F0;color:#5B3E7A}
  .linkbtn{background:none;border:none;color:var(--guinda-2);text-decoration:underline;font-size:12.5px;padding:0;text-underline-offset:3px}

  .paytabs{display:flex;gap:8px;margin:16px 0}
  .paytabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:11px 8px;font-weight:600;font-size:13.5px;color:var(--muted)}
  .paytabs button.on{border-color:var(--guinda);color:var(--guinda);background:#FBF4F5}
  .paybox{border:1px dashed var(--line);border-radius:8px;padding:20px;background:#FDFBFA}
  .captura{font-family:var(--mono);font-size:19px;letter-spacing:.12em;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;text-align:center;margin:12px 0}
  .barcode{height:52px;margin:10px auto 4px;max-width:340px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 11px,var(--ink) 11px 14px,transparent 14px 16px)}
  .paylogos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .paylogos span{font-size:11px;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--muted);background:#fff}
  .totalrow{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);margin-top:18px;padding-top:12px;font-weight:700;font-size:17px}

  .folio-hero{text-align:center;padding:34px 26px}
  .folio-hero .ok-ring{width:66px;height:66px;border-radius:50%;background:var(--verde);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 16px}
  .folio-num{font-family:var(--mono);font-size:22px;letter-spacing:.1em;background:var(--dorado-pale);border:1px solid #E4D3B8;border-radius:8px;display:inline-block;padding:8px 22px;margin:12px 0}
  .timeline{max-width:520px;margin:26px auto 0;text-align:left}
  .tl{display:flex;gap:14px;padding:0 0 22px;position:relative}
  .tl::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
  .tl:last-child::before{display:none}
  .tl .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;background:#EDE4E0;color:var(--muted);z-index:1}
  .tl.done .dot{background:var(--verde);color:#fff}
  .tl.now .dot{background:var(--guinda);color:#fff;box-shadow:0 0 0 4px #F3DFE4}
  .tl b{font-size:14px;display:block}
  .tl small{color:var(--muted);font-size:12.5px}

  /* ---------- dashboard / expediente ---------- */
  .dash{display:grid;grid-template-columns:1fr;gap:14px;padding:26px 0}
  .trow{display:flex;align-items:center;gap:18px;padding:18px 22px;cursor:pointer;transition:border-color .15s}
  .trow:hover{border-color:var(--dorado)}
  .trow .ic{width:44px;height:44px;border-radius:10px;background:var(--dorado-pale);display:grid;place-items:center;font-size:19px;flex:none}
  .trow b{display:block;font-size:15px}
  .trow small{color:var(--muted);font-size:12.5px}
  .trow .right{margin-left:auto;text-align:right;flex:none}
  .progressbar{height:5px;border-radius:99px;background:#EDE4E0;margin-top:8px;max-width:220px}
  .progressbar i{display:block;height:100%;border-radius:99px;background:var(--guinda)}
  .docgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:26px 0}
  @media (max-width:860px){.docgrid{grid-template-columns:1fr 1fr}}
  @media (max-width:620px){.docgrid{grid-template-columns:1fr}}
  .doccard{padding:20px;display:flex;flex-direction:column;gap:6px}
  .doccard .top{display:flex;justify-content:space-between;align-items:start}
  .doccard .ic{width:42px;height:42px;border-radius:10px;background:var(--dorado-pale);display:grid;place-items:center;font-size:18px}
  .doccard h3{font-size:14.5px;margin-top:8px}
  .doccard small{color:var(--muted);font-size:12.5px}
  .doccard .reuse{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--verde);font-weight:600}

  /* ---------- back-office ---------- */
  .bo{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 98px)}
  @media (max-width:860px){.bo{grid-template-columns:1fr}}
  .bo-side{background:var(--guinda-deep);color:#E4CCD2;padding:22px 0}
  .bo-side .dep{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
  .bo-side .dep b{color:#fff;font-size:13.5px;display:block;line-height:1.35}
  .bo-side .dep small{font-size:11px;color:#C79AA6;letter-spacing:.06em;text-transform:uppercase}
  .bo-side a{display:flex;justify-content:space-between;align-items:center;color:#E4CCD2;text-decoration:none;padding:9px 20px;font-size:13.5px}
  .bo-side a.on{background:rgba(188,149,92,.18);color:#fff;border-left:3px solid var(--dorado);padding-left:17px}
  .bo-side .badge{background:var(--dorado);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 8px}
  .bo-main{padding:26px;background:var(--paper)}
  .bo-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 22px}
  @media (max-width:860px){.bo-kpis{grid-template-columns:1fr 1fr}}
  .kpi{padding:16px 18px}
  .kpi b{font-size:24px;display:block}
  .kpi span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  .kpi .trend{font-size:12px;font-weight:700;margin-left:6px}
  table.queue{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
  .queue-scroll{overflow-x:auto;border-radius:var(--radius)}
  table.queue th{background:#F6F0ED;text-align:left;padding:11px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
  table.queue td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  table.queue tr:last-child td{border-bottom:none}
  table.queue tr.sel td{background:#FBF4F5}
  table.queue tbody tr{cursor:pointer}
  table.queue tbody tr:hover td{background:#FDF8F4}
  .sla{font-weight:700}
  .sla.ok{color:var(--verde)} .sla.warn{color:var(--ambar)} .sla.late{color:var(--rojo)}
  .review{margin-top:20px;padding:24px}
  .review .docchecks{margin:14px 0}
  .review textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:70px;margin-top:10px}

  <div class="overlay" onclick="if(event.target===this)closeLogin()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Iniciar sesión con Llave MX">
      <div class="mh">
        <span class="llave-ico">🔑</span>
        <h2>Llave MX</h2>
        <p>Tu llave de acceso al gobierno digital. Una sola cuenta para trámites federales, estatales y municipales.</p>
      </div>
      <div class="mb">
        <div class="f"><label>CURP o correo electrónico</label><input value="XORG880514MTLCMR04" readonly></div>
        <div class="f"><label>Contraseña</label><input type="password" value="••••••••••" readonly></div>
        <button class="btn btn-guinda lg" onclick="doLogin()">Iniciar sesión</button>
        <p class="alt">Autenticación federada (OIDC) — la maqueta simula el flujo. La plataforma nunca almacena tu contraseña: la identidad la valida Llave&nbsp;MX.</p>
      </div>
    </div>
  </div>`;
}
function closeLogin(){ document.getElementById('modal-root').innerHTML = ''; }
function doLogin(){
  S.user = { nombre:'María Guadalupe', ap:'Xochitiotzin', am:'Ramos', curp:'XORG880514MTLCMR04', email:'maria.xochitiotzin@correo.mx' };
  closeLogin();
  toast('🔑 Sesión iniciada con Llave MX — bienvenida, María Guadalupe');
  if(S.pendingRoute){ const r = S.pendingRoute; S.pendingRoute = null; go(r); } else render();
}
function logout(){ S.user = null; go('inicio'); toast('Sesión cerrada'); }
function demoLogin(){ if(S.user){ toast('La sesión Llave MX ya está iniciada'); } else openLogin(); }

/* ---------- wizard control ---------- */

function startWizard(id){
  const t = TRAMITES.find(x => x.id === id);
  if(!S.user){ openLogin(); S.pendingRoute = 'wizard/' + id; return; }
  S.wizard = { tramite: t, step: 1, pago: 'tarjeta', folio: null };
  go('wizard/' + id);
}
function wizNext(){
  if(S.wizard.step === 3){
    S.wizard.folio = 'TLX-2026-0' + (23000 + Math.floor(Math.random()*900));
  }
  S.wizard.step = Math.min(4, S.wizard.step + 1);
  render(); window.scrollTo(0,0);
}
function wizPrev(){ S.wizard.step = Math.max(1, S.wizard.step - 1); render(); }

/* ---------- toast / router ---------- */

let toastTimer;
function toast(msg){
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => r.innerHTML = '', 3400);
}

function go(route, keepFocus){
  if(location.hash === '#/' + route){ render(); return; }
  if(keepFocus){ history.replaceState(null,'','#/'+route); render(true); return; }
  location.hash = '#/' + route;
}

function render(keepFocus){
  const hash = (location.hash || '#/inicio').slice(2);
  const [path, qs] = hash.split('?');
  const params = new URLSearchParams(qs || '');
  let html = '';
  if(path === '' || path === 'inicio') html = shell(vInicio(), 'inicio');
  else if(path === 'catalogo') html = shell(vCatalogo(params), 'catalogo');
  else if(path.startsWith('tramite/')) html = shell(vFicha(path.split('/')[1]), 'tramite');
  else if(path.startsWith('wizard/')){
    if(!S.user || !S.wizard.tramite || S.wizard.tramite.id !== path.split('/')[1]){
      const t = TRAMITES.find(x => x.id === path.split('/')[1]);
      if(t && S.user) S.wizard = { tramite:t, step:1, pago:'tarjeta', folio:null };
      else { location.hash = '#/tramite/' + path.split('/')[1]; return; }
    }
    html = shell(vWizard(), 'wizard');
  }
  else if(path === 'mis-tramites') html = shell(vMisTramites(), 'mis-tramites');
  else if(path === 'expediente') html = shell(vExpediente(), 'expediente');
  else if(path === 'funcionarios') html = vFuncionarios();
  else if(path === 'funcionarios-config') html = vFuncionariosConfig();
  else html = shell(vInicio(), 'inicio');

  const app = document.getElementById('app');
  const activeSearch = keepFocus && document.activeElement && document.activeElement.tagName === 'INPUT'
    ? document.activeElement.value : null;
  app.innerHTML = html;
  if(activeSearch !== null){
    const inp = app.querySelector('.filters input');
    if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
  drawQR();
  if(!keepFocus) window.scrollTo(0,0);
}

function drawQR(){
  const c = document.getElementById('qr');
  if(!c) return;
  const ctx = c.getContext('2d');
  const n = 25, cell = 180/n;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,180,180);
  ctx.fillStyle = '#2B1F24';
  let seed = 42;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const finder = (x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(finder) continue;
    if(rnd() > .52) ctx.fillRect(x*cell, y*cell, cell-.5, cell-.5);
  }
  const f = (ox,oy) => {
    ctx.fillRect(ox,oy,7*cell,cell); ctx.fillRect(ox,oy+6*cell,7*cell,cell);
    ctx.fillRect(ox,oy,cell,7*cell); ctx.fillRect(ox+6*cell,oy,cell,7*cell);
    ctx.fillRect(ox+2*cell,oy+2*cell,3*cell,3*cell);
  };
  f(0,0); f(180-7*cell,0); f(0,180-7*cell);
}

window.addEventListener('hashchange', () => render());
render();
</script>
